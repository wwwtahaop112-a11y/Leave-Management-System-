<!DOCTYPE html>
<html>
<head>
    <title>Leave History</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body onload="window.loadHistory()" class="center">
    <div class="glass" style="width: 80%; max-width: 600px;">
        <h2>Leave History</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                    <th>Name</th>
                    <th>Type</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="historyTable">
                </tbody>
        </table>
        <br>
        <a href="index.html" style="color:white">Back to Dashboard</a>
    </div>
    <script type="module" src="JS/script.js"></script>
</body>
</html>
